name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py
      - name: Render contribution art
        run: python scripts/render_profile_stats.py
      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg stats.svg
          if git diff --cached --quiet; then
            echo "Contribution art is already up to date."
          else
            git commit -m "chore: refresh contribution stats [skip ci]"
            git push
          fi
