<svg xmlns="http://www.w3.org/2000/svg"
     width="420" height="420"
     viewBox="0 0 420 420"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Ajay Varsan — Developer Dossier</title>
  <desc id="desc">
    A cinematic developer profile introducing Ajay as an AI systems
    engineer and full-stack builder.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#69F0A0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <clipPath id="card">
      <rect width="420" height="420" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">

    <!-- Background -->
    <rect width="420" height="420" fill="url(#bg)"/>

    <!-- Technical grid -->
    <g stroke="#1F3A5F" stroke-width="0.5" opacity="0.35">
      <path d="M0 40 H420 M0 80 H420 M0 120 H420
               M0 160 H420 M0 200 H420 M0 240 H420
               M0 280 H420 M0 320 H420 M0 360 H420
               M40 0 V420 M80 0 V420 M120 0 V420
               M160 0 V420 M200 0 V420 M240 0 V420
               M280 0 V420 M320 0 V420 M360 0 V420"/>
    </g>

    <!-- Header -->
    <text x="25" y="31"
          fill="#69F0A0"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          letter-spacing="1.5">
      PERSONNEL FILE // 001
    </text>

    <text x="395" y="31"
          fill="#64748B"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10"
          text-anchor="end">
      DEV.CLASS
    </text>

    <path d="M25 45 H395" stroke="#1F3A5F"/>

    <!-- Identity -->
    <text x="25" y="82"
          fill="#64748B"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10"
          letter-spacing="2">
      SUBJECT IDENTIFIED
    </text>

    <text x="23" y="119"
          fill="#F1F5F9"
          font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace"
          font-size="29"
          font-weight="bold">
      AJAY VARSAN
    </text>

    <rect x="342" y="65" width="56" height="56"
          rx="10"
          fill="#0D223B"
          stroke="#1F3A5F"/>

    <image href="./assets/logo.png"
           x="346" y="69"
           width="48" height="48"
           preserveAspectRatio="xMidYMid meet"/>

    <rect x="25" y="134" width="4" height="30"
          rx="2" fill="url(#accent)"/>

    <text x="39" y="146"
          fill="#69F0A0"
          font-family="Arial, Helvetica, sans-serif"
          font-size="12">
      AI SYSTEMS ENGINEER
    </text>

    <text x="39" y="162"
          fill="#94A3B8"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11">
      Full-Stack Developer
    </text>

    <!-- Specialization -->
    <text x="25" y="199"
          fill="#64748B"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10"
          letter-spacing="1.5">
      PRIMARY DIRECTIVES
    </text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="12">

      <circle cx="32" cy="222" r="3" fill="#69F0A0"/>
      <text x="44" y="226" fill="#D1D5DB">
        Build intelligent systems
      </text>

      <circle cx="32" cy="248" r="3" fill="#69F0A0"/>
      <text x="44" y="252" fill="#D1D5DB">
        Engineer end-to-end products
      </text>

      <circle cx="32" cy="274" r="3" fill="#69F0A0"/>
      <text x="44" y="278" fill="#D1D5DB">
        Solve problems with algorithms
      </text>

    </g>

    <!-- Signature -->
    <rect x="25" y="302" width="370" height="65"
          rx="6"
          fill="#0D223B"
          stroke="#1F3A5F"/>

    <text x="39" y="322"
          fill="#64748B"
          font-family="Arial, Helvetica, sans-serif"
          font-size="9"
          letter-spacing="1.5">
      SIGNATURE MOVE
    </text>

    <text x="39" y="344"
          fill="#69F0A0"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13"
          font-weight="bold">
      IDEA → SYSTEM → PRODUCT
    </text>

    <text x="39" y="357"
          fill="#94A3B8"
          font-family="Arial, Helvetica, sans-serif"
          font-size="9">
      Understand the problem. Engineer the solution.
    </text>

    <!-- Footer -->
    <text x="25" y="395"
          fill="#64748B"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10">
      STATUS: ALWAYS BUILDING
    </text>

    <circle cx="385" cy="391" r="4" fill="#69F0A0">
      <animate attributeName="opacity"
               values="1;0.3;1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <path d="M25 407 H395" stroke="#1F3A5F"/>

  </g>
</svg>
